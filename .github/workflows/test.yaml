name: Test

on:
  push:
    branches: 
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '25.9.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '25.9.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc -b

  # go.mod の go directive と Dockerfile のビルド用 golang イメージがずれていると、
  # golang イメージは GOTOOLCHAIN=local なので release の docker build が
  # "go.mod requires go >= X (running go Y; GOTOOLCHAIN=local)" で落ちる。
  # test.yaml は setup-go で go.mod を見るだけなのでこのズレを検知できない。
  # renovate 側でも 1 PR にまとめているが、片方の版が未公開だと片肺の PR になりうるので
  # ここで最終的に止める。
  go-version-guard:
    name: Guard Go version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Check go.mod and Dockerfile agree on the Go version
        run: |
          set -euo pipefail
          gomod_version="$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)"
          image_version="$(sed -n 's|^FROM .*golang:\([0-9][0-9.]*\)-.*|\1|p' Dockerfile)"

          if [ -z "$gomod_version" ]; then
            echo "::error file=go.mod::go directive を読み取れませんでした"
            exit 1
          fi
          if [ -z "$image_version" ]; then
            echo "::error file=Dockerfile::golang ベースイメージのタグを読み取れませんでした"
            exit 1
          fi
          if [ "$(printf '%s\n' "$image_version" | wc -l)" -ne 1 ]; then
            echo "::error file=Dockerfile::golang ベースイメージが複数あります: $image_version"
            exit 1
          fi

          echo "go.mod:     $gomod_version"
          echo "Dockerfile: $image_version"

          if [ "$gomod_version" != "$image_version" ]; then
            echo "::error file=Dockerfile::Go のバージョンが go.mod ($gomod_version) と Dockerfile ($image_version) でずれています。両方揃えてください。"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, frontend-test, frontend-lint, go-version-guard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '25.9.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build backend binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o server ./cmd/server